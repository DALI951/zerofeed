name: ZEROFEED Cross-Device Build & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension-and-core-tests:
    name: Core Rule Engine & Chrome/Edge Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync shared rule engine into browser extension
        run: npm run sync:extension

      - name: Run automated rule engine & extension tests
        run: npm test

      - name: Package Chrome & Edge Manifest V3 Extension
        run: zip -r zerofeed-browser-extension.zip browser-extension/

      - name: Upload Browser Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerofeed-browser-extension
          path: zerofeed-browser-extension.zip

  windows-companion-build:
    name: Windows Desktop & Low-RAM Laptop Companion (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build native ZeroFeedWindows.exe
        run: npm run build:windows

      - name: Verify ZeroFeedWindows.exe CLI & Rule Evaluator
        run: .\windows-app\dist\ZeroFeedWindows.exe --verify

      - name: Run full Windows test suite
        run: npm test

      - name: Upload Windows Companion Executable
        uses: actions/upload-artifact@v4
        with:
          name: zerofeed-windows-companion
          path: windows-app/dist/ZeroFeedWindows.exe

  android-apk-build:
    name: Android 16 / One UI App (Kotlin + Jetpack Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Run Android Kotlin JUnit Tests & Assemble APK
        working-directory: android-app
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Rename APK for Release
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk ZEROFEED-Android-S23Ultra.apk

      - name: Upload Android APK Artifact (Galaxy S23 Ultra Ready)
        uses: actions/upload-artifact@v4
        with:
          name: zerofeed-android-apk
          path: ZEROFEED-Android-S23Ultra.apk

  publish-github-release:
    name: Publish APK & Binaries to GitHub Releases
    needs: [extension-and-core-tests, windows-companion-build, android-apk-build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: zerofeed-android-apk
          path: release-assets

      - name: Download Windows Companion Artifact
        uses: actions/download-artifact@v4
        with:
          name: zerofeed-windows-companion
          path: release-assets

      - name: Download Browser Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: zerofeed-browser-extension
          path: release-assets

      - name: Create or Update GitHub Release v1.0.0 with APK, EXE, and Extension ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 release-assets/* --clobber
          else
            gh release create v1.0.0 release-assets/* \
              --title "ZEROFEED v1.0.0 — Android APK (Galaxy S23 Ultra), Windows Companion & Browser Extension" \
              --notes "Automated Cross-Device Release of ZEROFEED. Download **ZEROFEED-Android-S23Ultra.apk** directly onto your Samsung Galaxy S23 Ultra (Android 16 / One UI), **ZeroFeedWindows.exe** for your Windows PC/Laptop, and **zerofeed-browser-extension.zip** for Chrome & Edge."
          fi
