name: ZEROFEED Cross-Device Build & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension-and-core-tests:
    name: Core Rule Engine & Chrome/Edge Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync shared rule engine into browser extension
        run: npm run sync:extension

      - name: Run automated rule engine & extension tests
        run: npm test

      - name: Package Chrome & Edge Manifest V3 Extension
        run: zip -r zerofeed-browser-extension.zip browser-extension/

      - name: Upload Browser Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerofeed-browser-extension
          path: zerofeed-browser-extension.zip

  windows-companion-build:
    name: Windows Desktop & Low-RAM Laptop Companion (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build native ZeroFeedWindows.exe
        run: npm run build:windows

      - name: Verify ZeroFeedWindows.exe CLI & Rule Evaluator
        run: .\windows-app\dist\ZeroFeedWindows.exe --verify

      - name: Run full Windows test suite
        run: npm test

      - name: Upload Windows Companion Executable
        uses: actions/upload-artifact@v4
        with:
          name: zerofeed-windows-companion
          path: windows-app/dist/ZeroFeedWindows.exe

  android-apk-build:
    name: Android 16 / One UI App (Kotlin + Jetpack Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x ./gradlew

      - name: Run Android Kotlin JUnit Tests & Assemble APK
        working-directory: android-app
        run: ./gradlew testDebugUnitTest assembleDebug -PciVersionCode=20${{ github.run_number }} -PciVersionName=2.0.${{ github.run_number }} --no-daemon

      - name: Prepare APK Assets for Release
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk ZEROFEED-Android-S23Ultra.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - name: Upload Android APK Artifact (Galaxy S23 Ultra Ready)
        uses: actions/upload-artifact@v4
        with:
          name: zerofeed-android-apk
          path: |
            ZEROFEED-Android-S23Ultra.apk
            app-debug.apk

  publish-github-release:
    name: Publish APK & Binaries to GitHub Releases
    needs: [extension-and-core-tests, windows-companion-build, android-apk-build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: zerofeed-android-apk
          path: release-assets

      - name: Download Windows Companion Artifact
        uses: actions/download-artifact@v4
        with:
          name: zerofeed-windows-companion
          path: release-assets

      - name: Download Browser Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: zerofeed-browser-extension
          path: release-assets

      - name: Publish New Versioned Release (v2.0.X) to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" release-assets/* \
            --latest \
            --title "ZEROFEED $TAG — In-App Instagram/YouTube Guard, Auto-Updater, Custom Icon & Permissions" \
            --notes "### ZEROFEED $TAG (Galaxy S23 Ultra / Android 16 / Windows / Chrome & Edge)
          - **Direct Android APK**: Download **ZEROFEED-Android-S23Ultra.apk** (or **app-debug.apk**) below.
          - **In-App Auto-Updater**: Checks GitHub Releases automatically and downloads/installs newer APKs right inside the app.
          - **Automatic Startup Permission Prompt**: Prompts on launch for Accessibility Guard (to quit Reels/Shorts) and Appear on Top Overlay (to cover Home Feeds while keeping the YouTube Search Bar and Instagram DMs accessible).
          - **Custom ZEROFEED Shield App Icon**: Adaptive vector launcher icon for One UI.
          - **Streak Protection**: Never counts you as slipped when ZEROFEED stops a Reel or Short."
